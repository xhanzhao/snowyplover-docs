<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <clipPath id="sp-body">
      <circle cx="42" cy="19" r="10"/>
      <path d="M5 41C14 35 22 30.5 31 29c2.2-.4 3.4-1.6 3.6-3.4L48.5 26.6C51.4 30 53 34.2 53 38.6 53 46 45 50 34.5 50 24 50 14 47 5 41Z"/>
    </clipPath>
  </defs>
  <!-- legs and toes -->
  <g stroke="#6b5c4c" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M31.5 49 30.6 58.4h3.6M38.6 49.4l.9 9h3.6"/>
  </g>
  <!-- outline: the same shapes stroked underneath, so the fills on top leave one clean silhouette edge -->
  <g fill="#3d3125" stroke="#3d3125" stroke-width="2.4" stroke-linejoin="round">
    <circle cx="42" cy="19" r="10"/>
    <path d="M5 41C14 35 22 30.5 31 29c2.2-.4 3.4-1.6 3.6-3.4L48.5 26.6C51.4 30 53 34.2 53 38.6 53 46 45 50 34.5 50 24 50 14 47 5 41Z"/>
  </g>
  <!-- white base -->
  <g fill="#fff">
    <circle cx="42" cy="19" r="10"/>
    <path d="M5 41C14 35 22 30.5 31 29c2.2-.4 3.4-1.6 3.6-3.4L48.5 26.6C51.4 30 53 34.2 53 38.6 53 46 45 50 34.5 50 24 50 14 47 5 41Z"/>
  </g>
  <g clip-path="url(#sp-body)">
    <!-- soft shadow under the belly -->
    <path d="M12 45c12 5.5 30 6.5 41-6v14H12Z" fill="#ebe4d8"/>
    <!-- crown and nape -->
    <path d="M30 30V6h24l-1.6 7.4C46 11.8 40 14.2 34.4 23Z" fill="#b8925c"/>
    <!-- back and wing -->
    <path d="M4 41.2C13 35 21 30 30 28.3c6.4-1.1 11.2.7 12.2 4.9 1.2 5.2-4.6 9.8-14 10.6C19 44.6 11 43.8 4 41.2Z" fill="#b8925c"/>
    <!-- feather edges -->
    <g fill="none" stroke="#d9be8f" stroke-width="1.1" stroke-linecap="round">
      <path d="M22 34.6c3.4-1.6 7.4-1.9 11-.9"/>
      <path d="M17 38c4-1.5 8.6-1.6 12.6-.3"/>
      <path d="M33.5 31.5c2.4-.6 4.8-.3 6.6 1"/>
    </g>
    <!-- darker primaries running to the tail -->
    <path d="M4 41.2c5-1.6 10.2-1.5 15.4.4-5.3 1.4-10.6 1.2-15.4-.4Z" fill="#7a5b35"/>
    <!-- black marks: forehead bar, eye stripe, neck patch -->
    <g fill="#1d1a17">
      <path d="M41.4 14.2c3.6-2.2 8-2.6 11.4-1.2l-.4 1.6c-3.6-.9-7.4-.9-11 -.4Z"/>
      <path d="M36.8 20.9c2.2-1.9 5.2-2.7 7.7-2.3-2.1 1-4.9 1.8-7.7 2.3Z"/>
      <path d="M39.6 28.6c3.2-1.9 8-1.9 10.8.1-2.7 2.6-7.8 2.8-10.8-.1Z"/>
    </g>
  </g>
  <!-- eye and beak -->
  <circle cx="45.4" cy="18.1" r="2.1" fill="#1d1a17"/>
  <circle cx="46.1" cy="17.4" r=".65" fill="#fff"/>
  <path d="M51 17.9 59.6 20.4 51 22.9Z" fill="#1d1a17" stroke="#1d1a17" stroke-width=".8" stroke-linejoin="round"/>
</svg>
