<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <clipPath id="sp-body">
      <circle cx="45.5" cy="17" r="7"/>
      <path d="M2.5 30.5C12 27 22 22.5 32 21.5c4-.4 7 0 9-1.5L49 20c2.2 3.4 4 7.6 3.6 12-.5 5.4-5.6 9-13.6 9.3-9 .3-17-2.8-25-6.4C9 33 5.5 31.6 2.5 30.5Z"/>
    </clipPath>
  </defs>
  <!-- long slim legs, the far one a shade lighter -->
  <g stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M33.2 40 30.8 49.2 32.6 58.2h3.4" stroke="#8a8279"/>
    <path d="M37.4 40.4 38.6 49.4 37 58.4h3.6" stroke="#5f5850"/>
  </g>
  <!-- outline: the same shapes stroked underneath, so the fills on top leave one clean silhouette edge -->
  <g fill="#3d3125" stroke="#3d3125" stroke-width="2.4" stroke-linejoin="round">
    <circle cx="45.5" cy="17" r="7"/>
    <path d="M2.5 30.5C12 27 22 22.5 32 21.5c4-.4 7 0 9-1.5L49 20c2.2 3.4 4 7.6 3.6 12-.5 5.4-5.6 9-13.6 9.3-9 .3-17-2.8-25-6.4C9 33 5.5 31.6 2.5 30.5Z"/>
  </g>
  <!-- white base -->
  <g fill="#fff">
    <circle cx="45.5" cy="17" r="7"/>
    <path d="M2.5 30.5C12 27 22 22.5 32 21.5c4-.4 7 0 9-1.5L49 20c2.2 3.4 4 7.6 3.6 12-.5 5.4-5.6 9-13.6 9.3-9 .3-17-2.8-25-6.4C9 33 5.5 31.6 2.5 30.5Z"/>
  </g>
  <g clip-path="url(#sp-body)">
    <!-- soft shadow under the belly -->
    <path d="M14 36.5c10 4.6 26 6.4 39-3V46H14Z" fill="#ebe4d8"/>
    <!-- crown, nape, back and wing in one sandy-brown mantle, ending in a patch at the side of the breast -->
    <path d="M0 30.8C13 33.6 26 34.6 35.5 32.6c5-1 8.6-3.2 9.8-6.2-2.6-1.4-4-3.6-3.6-6L47.8 14c1.4-1 3-1.4 4.8-1.1L54 0H0Z" fill="#a98a66"/>
    <!-- white brow over the eye -->
    <path d="M42.6 15.2c2.8-1.7 6-2.3 9.2-1.6" stroke="#fff" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- darker cheek mark behind the eye -->
    <path d="M41.6 19.6c1.6-1.6 3.6-2.3 5-2.1-1.2 1.2-3 1.9-5 2.1Z" fill="#6e5236"/>
    <!-- feather edges on the wing -->
    <g fill="none" stroke="#c9b08c" stroke-width="1" stroke-linecap="round">
      <path d="M21 29.4c3.6-1.4 7.6-1.6 11.2-.6"/>
      <path d="M15 31.4c4-1.2 8.4-1.2 12.2 0"/>
      <path d="M31.5 26c2.6-.7 5.4-.5 7.6.6"/>
    </g>
    <!-- dark primaries running out to the pointed tail -->
    <path d="M0 30.6c6-.6 12.6 0 19 2-6.6.9-13 .4-19-2Z" fill="#5a4330"/>
  </g>
  <!-- eye and slim beak -->
  <circle cx="47.6" cy="17.4" r="1.7" fill="#1d1a17"/>
  <circle cx="48.1" cy="16.9" r=".5" fill="#fff"/>
  <path d="M51.8 17.2 58.6 19 51.8 20.2Z" fill="#1d1a17" stroke="#1d1a17" stroke-width=".7" stroke-linejoin="round"/>
</svg>
